[package]
name = "hammer"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hammer"
path = "src/main.rs"

[dependencies]
hammer-runtime = { path = "../hammer-runtime" }
hammer-infra = { path = "../hammer-infra" }
hammer-ipc = { path = "../hammer-ipc" }
hammer-service = { path = "../hammer-service" }
hammer-core = { path = "../hammer-core" }
hammer-component-macros = { path = "../hammer-component-macros" }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bincode = { workspace = true }
linkme = { workspace = true }

[dev-dependencies]
# Build the real plugin DSOs used by `examples/plugin_additive_load.rs`.
hammer-plugin-ip = { path = "../hammer-plugins/ip" }
hammer-plugin-tcp = { path = "../hammer-plugins/transport/tcp" }
hammer-plugin-udp = { path = "../hammer-plugins/transport/udp" }
hammer-plugin-tun = { path = "../hammer-plugins/device/tun" }
thiserror = { workspace = true }
