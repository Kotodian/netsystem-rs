[package]
name = "hammer-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_runtime"

[features]
default = []
linux-platform = []
macos-platform = []

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-infra = { path = "../hammer-infra" }
hammer-component-macros = { path = "../hammer-component-macros" }
linkme = { workspace = true }
petgraph = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
crossbeam-queue = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-derive = { workspace = true }
ipnet = { workspace = true }
libc = { workspace = true }
libloading = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
core_affinity = { workspace = true }
io-uring = { workspace = true, features = ["io_safety"] }
thread-priority = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
indoc = { workspace = true }
# Ensures tested plugin cdylibs are built for registration dlsym tests.
hammer-plugin-ip = { path = "../hammer-plugins/ip" }
hammer-plugin-tun = { path = "../hammer-plugins/device/tun" }
# `test-util` enables `tokio::time::pause()` / `advance()` so timeout-based
# behaviour (TCP bridge drain idle, idle-keepalive backstop, etc.) can be
# verified without sleeping for real seconds. Test-only.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "buffer_alloc_free"
harness = false

[[bench]]
name = "graph_fanout"
harness = false
