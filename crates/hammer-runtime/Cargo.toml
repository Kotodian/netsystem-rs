[package]
name = "hammer-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_runtime"

[features]
default = []
linux-platform = []
apple-platform = []

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
hammer-infra = { path = "../hammer-infra" }
hammer-component-macros = { path = "../hammer-component-macros" }
linkme = { workspace = true }
petgraph = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-derive = { workspace = true }
ipnet = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
core_affinity = { workspace = true }
thread-priority = { workspace = true }

[dev-dependencies]
indoc = { workspace = true }
# `test-util` enables `tokio::time::pause()` / `advance()` so timeout-based
# behaviour (TCP bridge drain idle, idle-keepalive backstop, etc.) can be
# verified without sleeping for real seconds. Test-only — not pulled into
# the iOS xcframework.
tokio = { workspace = true, features = ["test-util"] }
