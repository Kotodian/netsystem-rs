[package]
name = "hammer-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_runtime"

[features]
default = []
# Enables the WireGuard endpoint module. Pulls in the matching feature in
# hammer-core. Off by default to keep the iOS xcframework slim.
wireguard = ["hammer-core/wireguard", "dep:boringtun"]

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
async-trait = { workspace = true }
boringtun = { workspace = true, optional = true }
hickory-proto = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures = { workspace = true }
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
tokio-rustls = { workspace = true }
blake2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true }
smoltcp = { workspace = true }
tun-rs = { workspace = true }
ipnet = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
indoc = { workspace = true }
