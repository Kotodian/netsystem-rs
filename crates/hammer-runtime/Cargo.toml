[package]
name = "hammer-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_runtime"

[features]
default = [
    "inbound-tun",
    "outbound-hysteria2",
    "outbound-direct",
    "outbound-block",
    "outbound-urltest",
    "dns-udp",
    "dns-tcp",
    "dns-hosts",
    "dns-local",
    "probe",
]
# Outbound-level latency probing. Adds `ProbeManager` + `IcmpOutboundProbe`
# under `crate::probe`, plus the `RuntimeService::probe_outbounds` API.
# Off-by-default users (slim builds without diagnostic UI) can drop it.
probe = ["dep:socket2"]
inbound-tun = ["dep:libc", "dep:tun-rs"]
outbound-hysteria2 = [
    "hammer-core/outbound-hysteria2",
    "dep:base64",
    "dep:blake2",
    "dep:futures",
    "dep:h3",
    "dep:h3-quinn",
    "dep:http",
    "dep:quinn",
    "dep:rand",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-platform-verifier",
]
outbound-direct = ["dep:socket2"]
outbound-block = []
# Outbound group that probes child outbounds via HTTP HEAD over the proxied
# stream and routes traffic through the lowest-latency child. Carries its own
# TLS stack since the probe URL is normally https.
outbound-urltest = [
    "dep:base64",
    "dep:httparse",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
    "dep:url",
]
dns-udp = ["dns-tcp"]
dns-tcp = []
dns-https = [
    "dep:base64",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
]
dns-hosts = []
dns-local = []
# Enables the generic endpoint domain. Concrete endpoint protocols opt into
# this parent feature.
endpoint = ["hammer-core/endpoint"]
# Enables the WireGuard endpoint module. Pulls in the matching feature in
# hammer-core. Off by default to keep the iOS xcframework slim.
wireguard = [
    "endpoint",
    "hammer-core/wireguard",
    "ipstack",
    "dep:boringtun",
    "dep:socket2",
]
# Generic user-space TCP/IP stack on top of an arbitrary IP carrier. Currently
# consumed only by the WireGuard outbound; the TUN inbound's smoltcp mode will
# share it once it lands. Off by default to keep the iOS xcframework slim.
ipstack = ["dep:smoltcp"]

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
async-trait = { workspace = true }
boringtun = { workspace = true, optional = true }
hickory-proto = { workspace = true }
bytes = { workspace = true }
http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
url = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-derive = { workspace = true }
smoltcp = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
tun-rs = { workspace = true, optional = true }
ipnet = { workspace = true }
libc = { workspace = true, optional = true }
lru = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustls-platform-verifier = { workspace = true, optional = true }

[dev-dependencies]
indoc = { workspace = true }
rcgen = { workspace = true }
