[package]
name = "hammer-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_runtime"
crate-type = ["dylib", "rlib"]

[features]
default = []
linux-platform = []
macos-platform = []

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-infra = { path = "../hammer-infra" }
hammer-stats = { path = "../hammer-stats" }
hammer-component-macros = { path = "../hammer-component-macros" }
zerocopy = "0.8.48"
linkme = { workspace = true }
petgraph = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
bitflags = "2.10"
abi_stable = { workspace = true }
bytes = { workspace = true }
bincode = { workspace = true }
crossbeam-queue = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
humantime-serde = { workspace = true }
byte-unit = { workspace = true }
libc = { workspace = true }
libloading = { workspace = true }
object = { workspace = true }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[target.'cfg(target_os = "linux")'.dependencies]
core_affinity = { workspace = true }
io-uring = { workspace = true, features = ["io_safety"] }
thread-priority = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "buffer_alloc_free"
harness = false

[[bench]]
name = "graph_fanout"
harness = false
