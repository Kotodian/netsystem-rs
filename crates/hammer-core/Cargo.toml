[package]
name = "hammer-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_core"

[features]
default = []
# Enables Hysteria2 protocol/config schema (`[hysteria2]` and
# `type = "hysteria2"`). The runtime outbound component has its own
# `outbound-hysteria2` feature.
hysteria2 = ["dep:blake2", "dep:bytes", "dep:http", "dep:rand"]
# Enables WireGuard protocol/config schema on top of the IP stack
# (`[[endpoints]]` with `type = "wireguard"`). The runtime endpoint component
# has its own `endpoint-wireguard` feature.
ipstack-wireguard = ["ipstack", "dep:boringtun", "dep:serde_with", "serde_with/base64"]
# Generic user-space TCP/IP stack protocol machinery shared by runtime
# components such as WireGuard. Also gates the core `[[endpoints]]` config
# shape that feeds IP-stack protocols; endpoint lifecycle/manager wiring lives
# in hammer-runtime.
ipstack = ["dep:bytes", "dep:smoltcp", "dep:rustc-hash"]

[dependencies]
serde = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ipnet = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
humantime-serde = { workspace = true }
serde_with = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
boringtun = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hickory-proto = { workspace = true }
http = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
smoltcp = { workspace = true, optional = true }

[dev-dependencies]
indoc = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
