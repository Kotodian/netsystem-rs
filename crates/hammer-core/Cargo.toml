[package]
name = "hammer-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_core"

[features]
default = []
# Enables the WireGuard peer state machine + config schema (`[[endpoints]]`
# with `type = "wireguard"`). The runtime endpoint component has its own
# `endpoint-wireguard` feature; this one carries the protocol primitives
# (boringtun `Tunn`, peer struct, `WIREGUARD_OVERHEAD`) the runtime relies on.
wireguard = ["dep:bytes", "dep:boringtun", "dep:serde_with", "serde_with/base64"]
amneziawg = ["wireguard", "boringtun/amneziawg"]

[dependencies]
hammer-infra = { path = "../hammer-infra" }
serde = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ipnet = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
humantime-serde = { workspace = true }
serde_with = { workspace = true, optional = true }
boringtun = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
nom = { workspace = true }
etherparse = { workspace = true }
bitflags = "2.10"

[dev-dependencies]
indoc = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
