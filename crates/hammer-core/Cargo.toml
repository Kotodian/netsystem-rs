[package]
name = "hammer-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_core"

[features]
default = []
tls = ["dep:base64"]
# Enables Hysteria2 protocol/config schema (`[hysteria2]` and
# `type = "hysteria2"`). The runtime outbound component has its own
# `outbound-hysteria2` feature.
hysteria2 = ["tls", "dep:blake2", "dep:bytes", "dep:http", "dep:rand"]
# Enables VLESS outbound config schema (`[[outbounds]] type = "vless"`).
vless = ["tls", "dep:aws-lc-rs", "dep:rand"]
# Enables the WireGuard peer state machine + config schema (`[[endpoints]]`
# with `type = "wireguard"`). The runtime endpoint component has its own
# `endpoint-wireguard` feature; this one carries the protocol primitives
# (boringtun `Tunn`, peer struct, `WIREGUARD_OVERHEAD`) the runtime relies on.
wireguard = ["dep:bytes", "dep:boringtun", "dep:serde_with", "serde_with/base64"]
amneziawg = ["wireguard", "boringtun/amneziawg"]

[dependencies]
serde = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ipnet = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
humantime-serde = { workspace = true }
serde_with = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
boringtun = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hickory-proto = { workspace = true }
http = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
nom = { workspace = true }

[dev-dependencies]
indoc = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
