[package]
name = "hammer-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_core"

[features]
# Enables WireGuard endpoint config schema (`[[endpoints]]` with
# `type = "wireguard"`). Off by default to keep iOS xcframework builds slim
# for users who only need hysteria2; opt in with `--features wireguard`.
default = []
wireguard = ["dep:base64"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ipnet = { workspace = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
indoc = { workspace = true }
