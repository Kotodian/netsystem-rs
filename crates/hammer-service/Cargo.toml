[package]
name = "hammer-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_service"
crate-type = ["dylib", "rlib"]


[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bitflags = "2.10"
crossbeam-queue = { workspace = true }
crossbeam-utils = { workspace = true }
hammer-core = { path = "../hammer-core" }
hammer-infra = { path = "../hammer-infra" }
hammer-ipc = { path = "../hammer-ipc" }
hammer-stats = { path = "../hammer-stats" }
hammer-component-macros = { path = "../hammer-component-macros" }
hammer-runtime = { path = "../hammer-runtime", default-features = false }
prometheus = { version = "0.14", default-features = false }
ipnet = { workspace = true }
nom = { workspace = true }
prost = { workspace = true }
etherparse = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
smoltcp = { workspace = true }
thiserror = { workspace = true }
linkme = { workspace = true }
libc = { workspace = true }

serde = { workspace = true }
humantime-serde = { workspace = true }
toml = { workspace = true }
