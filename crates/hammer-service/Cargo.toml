[package]
name = "hammer-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer_service"

[features]
default = ["plugins-lab"]
plugins-lab = [
  "plugin-device", "plugin-interface", "plugin-tun", "plugin-ip",
  "plugin-transport", "plugin-session", "plugin-tcp", "plugin-udp",
]
plugin-device = []
plugin-interface = ["plugin-device"]
plugin-tun = ["plugin-device", "plugin-interface"]
plugin-ip = ["plugin-interface"]
plugin-transport = ["plugin-ip"]
plugin-session = ["plugin-transport"]
plugin-tcp = ["plugin-session", "plugin-transport"]
plugin-udp = ["plugin-transport"]

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bitflags = "2.10"
crossbeam-utils = { workspace = true }
hammer-core = { path = "../hammer-core" }
hammer-infra = { path = "../hammer-infra" }
hammer-component-macros = { path = "../hammer-component-macros" }
hammer-runtime = { path = "../hammer-runtime", default-features = false }
ipnet = { workspace = true }
nom = { workspace = true }
etherparse = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
smoltcp = { workspace = true }
thiserror = { workspace = true }
linkme = { workspace = true }
libc = { workspace = true }

serde = { workspace = true }

[dev-dependencies]
