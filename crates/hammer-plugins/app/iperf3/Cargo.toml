[package]
name = "hammer-plugin-iperf3"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false

[lib]
name = "hammer_plugin_iperf3"
crate-type = ["dylib", "rlib"]

[dependencies]
abi_stable = { workspace = true }
zerocopy = { version = "0.8.48", features = ["derive"] }
hammer-infra = { path = "../../../hammer-infra" }
hammer-plugin-session = { path = "../../session" }
hammer-plugin-tcp = { path = "../../transport/tcp" }
hammer-runtime = { path = "../../../hammer-runtime", default-features = false }
hammer-service = { path = "../../../hammer-service", default-features = false }
hammer-component-macros = { path = "../../../hammer-component-macros" }
serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
toml = { workspace = true }
humantime-serde = { workspace = true }
linkme = { workspace = true }
tracing = { workspace = true }
