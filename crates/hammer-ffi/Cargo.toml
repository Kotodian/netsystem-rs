[package]
name = "hammer-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer"
crate-type = ["cdylib", "staticlib", "rlib"]

# The uniffi-bindgen entrypoint lives in `crates/hammer-uniffi-bindgen` so the
# `cli` feature of uniffi does not get unified into the iOS staticlib build.

[features]
default = []
[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
hammer-service = { path = "../hammer-service", default-features = false }
async-trait = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
indoc = { workspace = true }
