[package]
name = "hammer-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer"
crate-type = ["cdylib", "staticlib", "rlib"]

# The uniffi-bindgen entrypoint lives in `crates/hammer-uniffi-bindgen` so the
# `cli` feature of uniffi does not get unified into the iOS staticlib build.

[features]
# The default feature set targets the iOS NetExt deployment: WireGuard outbound
# plus the inbound/DNS/route plumbing the host actually needs at runtime.
# Hysteria2 is opt-in via the `hysteria2` feature.
default = ["wireguard"]
# Enables generic endpoint config/service wiring.
endpoint = ["hammer-core/endpoint", "hammer-runtime/endpoint"]
# WireGuard endpoint stack plus everything required to ship it on iOS:
# TUN inbound, the route engine's standard outbounds (direct/block/urltest),
# DNS transports, and outbound probing.
wireguard = [
    "endpoint",
    "hammer-core/wireguard",
    "hammer-runtime/wireguard",
    "hammer-runtime/inbound-tun",
    "hammer-runtime/outbound-direct",
    "hammer-runtime/outbound-block",
    "hammer-runtime/outbound-urltest",
    "hammer-runtime/dns-udp",
    "hammer-runtime/dns-tcp",
    "hammer-runtime/dns-hosts",
    "hammer-runtime/dns-local",
    "hammer-runtime/probe",
]
# Hysteria2 outbound, opt-in to keep the iOS xcframework slim.
hysteria2 = ["hammer-runtime/outbound-hysteria2"]

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
hammer-runtime = { path = "../hammer-runtime", default-features = false }
async-trait = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
indoc = { workspace = true }
