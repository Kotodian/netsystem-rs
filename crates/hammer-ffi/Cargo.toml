[package]
name = "hammer-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer"
crate-type = ["cdylib", "staticlib", "rlib"]

# The uniffi-bindgen entrypoint lives in `crates/hammer-uniffi-bindgen` so the
# `cli` feature of uniffi does not get unified into the iOS staticlib build.

[features]
# Default is the iOS NetExt baseline: TUN inbound, the outbounds the route
# engine always reaches for, and outbound probing.
default = [
    "hammer-service/inbound-tun",
    "hammer-service/outbound-block",
    "hammer-service/probe",
]
# Generic endpoint config/service wiring; required by endpoint-style protocols.
endpoint = ["hammer-service/endpoint"]
# WireGuard endpoint stack. Opt-in.
wireguard = ["endpoint", "hammer-core/wireguard", "hammer-service/endpoint-wireguard"]
[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
hammer-service = { path = "../hammer-service", default-features = false }
async-trait = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
indoc = { workspace = true }
