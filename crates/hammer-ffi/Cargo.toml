[package]
name = "hammer-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer"
crate-type = ["cdylib", "staticlib", "rlib"]

# The uniffi-bindgen entrypoint lives in `crates/hammer-uniffi-bindgen` so the
# `cli` feature of uniffi does not get unified into the iOS staticlib build.

[features]
# Default is the iOS NetExt baseline: TUN inbound, DNS transports, the
# outbounds the route engine always reaches for (direct/block/urltest), and
# outbound probing. All proxy protocols (wireguard, hysteria2, ...) are
# opt-in modules layered on top.
default = [
    "hammer-runtime/inbound-tun",
    "hammer-runtime/outbound-direct",
    "hammer-runtime/outbound-block",
    "hammer-runtime/outbound-urltest",
    "hammer-runtime/dns-udp",
    "hammer-runtime/dns-tcp",
    "hammer-runtime/dns-hosts",
    "hammer-runtime/dns-local",
    "hammer-runtime/probe",
]
# Generic endpoint config/service wiring; required by endpoint-style protocols.
endpoint = ["hammer-core/endpoint", "hammer-runtime/endpoint"]
# WireGuard endpoint stack. Opt-in.
wireguard = ["endpoint", "hammer-core/wireguard", "hammer-runtime/wireguard"]
# Hysteria2 outbound. Opt-in.
hysteria2 = ["hammer-runtime/outbound-hysteria2"]

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
hammer-runtime = { path = "../hammer-runtime", default-features = false }
async-trait = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
indoc = { workspace = true }
