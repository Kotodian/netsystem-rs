[package]
name = "hammer-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hammer"
crate-type = ["cdylib", "staticlib", "rlib"]

# The uniffi-bindgen entrypoint lives in `crates/hammer-uniffi-bindgen` so the
# `cli` feature of uniffi does not get unified into the iOS staticlib build.

[features]
default = ["hammer-runtime/default"]
# Enables generic endpoint config/service wiring.
endpoint = ["hammer-core/endpoint", "hammer-runtime/endpoint"]
# Enables the WireGuard endpoint stack across hammer-core + hammer-runtime.
# Off by default; opt in at xcframework build time with `--features wireguard`.
wireguard = ["endpoint", "hammer-core/wireguard", "hammer-runtime/wireguard"]

[dependencies]
hammer-core = { path = "../hammer-core" }
hammer-adapter = { path = "../hammer-adapter" }
hammer-runtime = { path = "../hammer-runtime", default-features = false }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
indoc = { workspace = true }
