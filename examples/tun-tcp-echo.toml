# Tun TCP Lab — VPP-shaped, config-driven (no ops CLI).
# Address plan avoids LAN 192.168.1.0/24 and Fake-IP 198.18.0.0/15.

plugins = [
  "tun",
  "ip",
  "tcp",
  "udp",
  "tls",
]

[binary_api]
socket_path = "/tmp/hammer-tcp-integration.binary-api.sock"

[log]
level = "debug"

[trace]
enabled = true
record_capacity = 64
packet_capacity = 16

[[trace.inputs]]
node = "tun-input"
count = 32

# VPP: cpu { workers 1 } / unix { poll-sleep-usec 50000 }
[worker]
workers = 1
poll_sleep = "50ms"

# VPP: buffers { data-size 2048  buffers-per-numa 2048 }
[worker.buffer]
data_size = 2048
buffers_per_numa = 2048

# VPP: session { enable use-app-socket-api preallocated-sessions event-queue-length }
[network.session]
attach_socket_path = "/tmp/hammer-tcp-integration.attach.sock"
preallocated_sessions = 64
event_queue_length = 256

[network.session.buffer]
slot_bytes = 2048
slots = 4

# Lab-shortened timers (plugin-owned schema)
[plugin.tcp]
mss = 1440
receive_window = 65535
congestion = "bbr"
nagle = true
time_wait = "2s"
paws_idle = "24h"

[plugin.tcp.pmtu]
enabled = true

[plugin.tcp.retransmit]
initial = "50ms"
min = "50ms"
max = "3s"

[plugin.tcp.keepalive]
idle = "3s"
probe_interval = "1s"
probe_limit = 3

[plugin.tun]

[[plugin.tun.interfaces]]
name = "utun"
address = ["10.66.77.1/30"]
mtu = { l3 = 1500, ip4 = 1500, ip6 = 1500, mpls = 1500 }

[[network.route]]
prefix = "10.66.77.0/30"
interface = "utun"
