name: TCP Integration
run-name: TCP integration for ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tcp-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tcp-lab-binaries:
    name: TCP lab binaries [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: tcp-lab-binaries-${{ matrix.platform }}
      - name: Build TCP lab binaries [${{ matrix.platform }}]
        run: |
          cargo build --locked \
            -p hammer \
            -p hammerctl \
            -p hammer-plugin-tun \
            -p hammer-plugin-ip \
            -p hammer-plugin-tcp \
            -p hammer-plugin-udp
          cargo build --locked -p hammer --example tun_tcp_echo
      - name: Package TCP lab binaries [${{ matrix.platform }}]
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/tcp-lab-binaries"
          mkdir -p "$package/bin" "$package/plugins" "$package/rustlib"
          cp target/debug/hammer target/debug/hammerctl "$package/bin/"
          cp target/debug/examples/tun_tcp_echo "$package/bin/"
          case "$RUNNER_OS" in
            Linux) plugin_extension=so ;;
            macOS) plugin_extension=dylib ;;
          esac
          cp target/debug/libhammer_plugin_tun."$plugin_extension" "$package/plugins/"
          cp target/debug/libhammer_plugin_ip."$plugin_extension" "$package/plugins/"
          cp target/debug/libhammer_plugin_tcp."$plugin_extension" "$package/plugins/"
          cp target/debug/libhammer_plugin_udp."$plugin_extension" "$package/plugins/"
          cp target/debug/libhammer_infra."$plugin_extension" "$package/rustlib/"
          cp target/debug/libhammer_core."$plugin_extension" "$package/rustlib/"
          cp target/debug/libhammer_runtime."$plugin_extension" "$package/rustlib/"
          cp target/debug/libhammer_service."$plugin_extension" "$package/rustlib/"
          rust_libdir="$(rustc --print target-libdir)"
          find "$rust_libdir" -maxdepth 1 -type f \
            \( -name '*.so' -o -name '*.dylib' \) \
            -exec cp {} "$package/rustlib/" \;
          tar -C "$package" -czf "$RUNNER_TEMP/tcp-lab-binaries-${{ matrix.platform }}.tar.gz" .
      - name: Upload TCP lab binaries [${{ matrix.platform }}]
        uses: actions/upload-artifact@v4
        with:
          name: tcp-lab-binaries-${{ matrix.platform }}
          path: ${{ runner.temp }}/tcp-lab-binaries-${{ matrix.platform }}.tar.gz
          compression-level: 0
          retention-days: 1

  tun:
    name: TUN ${{ matrix.scenario }} [${{ matrix.platform }}]
    needs: tcp-lab-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - scenario: attached-echo-keepalive
            platform: Linux
            id: keepalive-linux
            runner: ubuntu-24.04
            congestion: bbr
            rto: 50ms
            echo_bytes: 200000
            idle_seconds: "5"
            fault: none
            mss: "1000"
          - scenario: attached-echo-keepalive
            platform: macOS
            id: keepalive-macos
            runner: macos-15
            congestion: bbr
            rto: 50ms
            echo_bytes: 200000
            idle_seconds: "5"
            fault: none
            # Darwin rejects a pre-connect TCP_MAXSEG above the unconnected
            # default (~536), so the macOS probe must not shape its MSS.
            mss: "0"
          - scenario: congestion-bbr
            platform: Linux
            id: congestion-bbr
            runner: ubuntu-24.04
            congestion: bbr
            rto: 50ms
            echo_bytes: 1000000
            idle_seconds: "0"
            fault: none
            mss: "1000"
          - scenario: congestion-cubic
            platform: Linux
            id: congestion-cubic
            runner: ubuntu-24.04
            congestion: cubic
            rto: 50ms
            echo_bytes: 1000000
            idle_seconds: "0"
            fault: none
            mss: "1000"
          - scenario: receiver-sack
            platform: Linux
            id: receiver-sack
            runner: ubuntu-24.04
            congestion: bbr
            rto: 50ms
            echo_bytes: 10000
            idle_seconds: "0"
            fault: client-egress
            fault_offset: 4000
            mss: "1000"
          - scenario: sender-rack
            platform: Linux
            id: sender-rack
            runner: ubuntu-24.04
            congestion: bbr
            rto: 2s
            echo_bytes: 10000
            idle_seconds: "0"
            fault: server-ingress
            fault_offset: 4000
            mss: "1000"
          - scenario: sender-tlp
            platform: Linux
            id: sender-tlp
            runner: ubuntu-24.04
            congestion: bbr
            rto: 2s
            echo_bytes: 6000
            idle_seconds: "0"
            fault: server-ingress
            fault_offset: 5000
            mss: "1000"
    env:
      TCP_TEST_ADDRESS: 10.66.77.1
      TCP_TEST_HOST_ADDRESS: 10.66.77.2
      TCP_TEST_NETMASK: 255.255.255.252
      TCP_TEST_PORT: "7300"
      TCP_TEST_ROUTE_PREFIX: 10.66.77.0/30
      TCP_TEST_ATTACH_SOCKET: /tmp/hammer-tcp-integration.attach.sock
      TCP_TEST_IPC_ADDRESS: 127.0.0.1:7399
      TCP_TEST_MSS: ${{ matrix.mss }}
    steps:
      - name: Checkout [${{ matrix.id }}]
        uses: actions/checkout@v4
      - name: Download TCP lab binaries [${{ matrix.id }}]
        uses: actions/download-artifact@v4
        with:
          name: tcp-lab-binaries-${{ matrix.platform }}
          path: ${{ runner.temp }}/tcp-lab-download
      - name: Extract TCP lab binaries [${{ matrix.id }}]
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tcp-lab-binaries"
          tar -C "$RUNNER_TEMP/tcp-lab-binaries" -xzf \
            "$RUNNER_TEMP/tcp-lab-download/tcp-lab-binaries-${{ matrix.platform }}.tar.gz"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/tcp-lab-binaries/rustlib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/tcp-lab-binaries/rustlib" >> "$GITHUB_ENV"
      - name: Prepare diagnostics [${{ matrix.id }}]
        run: |
          set -euo pipefail
          echo "TCP_TEST_DIAGNOSTICS=$RUNNER_TEMP/hammer-tcp-integration" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hammer-tcp-integration"
      - name: Generate scenario config [${{ matrix.id }}]
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/tcp-lab-${{ matrix.scenario }}.toml"
          cp examples/tun-tcp-echo.toml "$config"
          sed -i.bak \
            -e 's/^congestion = .*/congestion = "${{ matrix.congestion }}"/' \
            -e 's/^initial = .*/initial = "${{ matrix.rto }}"/' \
            -e 's/^min = .*/min = "${{ matrix.rto }}"/' \
            "$config"
          rm -f "$config.bak"
          cp "$config" "$TCP_TEST_DIAGNOSTICS/"
          echo "TCP_TEST_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Disable host TCP timestamps
        # Keeps kernel client segments at exactly TCP_MAXSEG bytes so absolute
        # segment-boundary sequences derived from the ISN stay valid.
        if: runner.os == 'Linux'
        run: sudo -n sysctl -w net.ipv4.tcp_timestamps=0
      - name: Prepare Linux TUN host
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [[ ! -c /dev/net/tun ]]; then
            sudo -n mkdir -p /dev/net
            sudo -n mknod /dev/net/tun c 10 200
            sudo -n chmod 0666 /dev/net/tun
          fi
          ip -o link show > "$TCP_TEST_DIAGNOSTICS/interfaces-before.txt"
      - name: Snapshot macOS interfaces
        if: runner.os == 'macOS'
        id: macos_interfaces
        run: |
          ifconfig -l > "$TCP_TEST_DIAGNOSTICS/interfaces-before.txt"
          echo "before=$(ifconfig -l)" >> "$GITHUB_OUTPUT"
      - name: Start Hammer [${{ matrix.id }}]
        env:
          HAMMER_BINARY: ${{ runner.temp }}/tcp-lab-binaries/bin/hammer
          HAMMER_PLUGIN_DIR: ${{ runner.temp }}/tcp-lab-binaries/plugins
          HAMMER_RUST_LIBDIR: ${{ runner.temp }}/tcp-lab-binaries/rustlib
        run: |
          set -euo pipefail
          if [[ ! -x "$HAMMER_BINARY" ]]; then
            echo "missing Hammer binary: $HAMMER_BINARY" >&2
            exit 1
          fi
          : > "$TCP_TEST_DIAGNOSTICS/daemon.log"
          sudo -n rm -f "$TCP_TEST_ATTACH_SOCKET"
          hammer_pid="$(
            sudo -n /bin/sh -c '
              log=$1
              plugin_dir=$2
              ipc_address=$3
              binary=$4
              config=$5
              rust_libdir=$6
              nohup env \
                LD_LIBRARY_PATH="$rust_libdir" \
                DYLD_LIBRARY_PATH="$rust_libdir" \
                HAMMER_PLUGIN_DIR="$plugin_dir" \
                HAMMER_IPC_ADDR="$ipc_address" \
                HAMMER_LOG="debug" \
                RUST_BACKTRACE="1" \
                "$binary" "$config" \
                </dev/null >>"$log" 2>&1 &
              echo $!
            ' hammer-tcp-integration \
              "$TCP_TEST_DIAGNOSTICS/daemon.log" \
              "$HAMMER_PLUGIN_DIR" \
              "$TCP_TEST_IPC_ADDRESS" \
              "$HAMMER_BINARY" \
              "$TCP_TEST_CONFIG" \
              "$HAMMER_RUST_LIBDIR"
          )"
          if [[ ! "$hammer_pid" =~ ^[0-9]+$ ]]; then
            echo "invalid Hammer PID: $hammer_pid" >&2
            exit 1
          fi
          echo "HAMMER_PID=$hammer_pid" >> "$GITHUB_ENV"
      - name: Wait for Linux TUN interface
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for _ in {1..90}; do
            if ! sudo -n kill -0 "$HAMMER_PID" 2>/dev/null; then
              cat "$TCP_TEST_DIAGNOSTICS/daemon.log" >&2
              echo "Hammer exited before creating the Linux TUN interface" >&2
              exit 1
            fi
            if ip link show dev utun >/dev/null 2>&1; then
              echo "TCP_TEST_INTERFACE=utun" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$TCP_TEST_DIAGNOSTICS/daemon.log" >&2
          echo "Hammer did not create the Linux TUN interface within 90 seconds" >&2
          exit 1
      - name: Wait for macOS utun interface
        if: runner.os == 'macOS'
        timeout-minutes: 2
        env:
          INTERFACES_BEFORE: ${{ steps.macos_interfaces.outputs.before }}
        run: |
          set -euo pipefail
          for _ in {1..90}; do
            if ! sudo -n kill -0 "$HAMMER_PID" 2>/dev/null; then
              cat "$TCP_TEST_DIAGNOSTICS/daemon.log" >&2
              echo "Hammer exited before creating a macOS utun interface" >&2
              exit 1
            fi
            for interface in $(ifconfig -l); do
              if [[ "$interface" =~ ^utun[0-9]+$ ]] \
                && [[ " $INTERFACES_BEFORE " != *" $interface "* ]]
              then
                echo "TCP_TEST_INTERFACE=$interface" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 1
          done
          cat "$TCP_TEST_DIAGNOSTICS/daemon.log" >&2
          echo "Hammer did not create a macOS utun interface within 90 seconds" >&2
          exit 1
      - name: Configure Linux TUN host
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo -n ip address replace "$TCP_TEST_HOST_ADDRESS/32" \
            peer "$TCP_TEST_ADDRESS/32" dev "$TCP_TEST_INTERFACE"
          sudo -n ip link set dev "$TCP_TEST_INTERFACE" up
          sudo -n ip route replace "$TCP_TEST_ROUTE_PREFIX" \
            dev "$TCP_TEST_INTERFACE"
      - name: Configure macOS utun host
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sudo -n route -n delete -net "$TCP_TEST_ROUTE_PREFIX" \
            -interface "$TCP_TEST_INTERFACE" >/dev/null 2>&1 || true
          sudo -n ifconfig "$TCP_TEST_INTERFACE" \
            inet "$TCP_TEST_HOST_ADDRESS" "$TCP_TEST_ADDRESS" \
            netmask "$TCP_TEST_NETMASK" up
          sudo -n route -n add -net "$TCP_TEST_ROUTE_PREFIX" \
            -interface "$TCP_TEST_INTERFACE"
      - name: Start packet capture [${{ matrix.id }}]
        run: |
          set -euo pipefail
          tcpdump_pid="$(
            sudo -n /bin/sh -c '
              interface=$1
              capture=$2
              log=$3
              # -Z root: Debian-family tcpdump drops to the tcpdump user before
              # opening -w output, which cannot write root-owned scratch dirs.
              nohup tcpdump -Z root -U -n -i "$interface" -w "$capture" \
                </dev/null >>"$log" 2>&1 &
              echo $!
            ' hammer-tcpdump \
              "$TCP_TEST_INTERFACE" \
              "$TCP_TEST_DIAGNOSTICS/traffic.pcap" \
              "$TCP_TEST_DIAGNOSTICS/tcpdump.log"
          )"
          if [[ ! "$tcpdump_pid" =~ ^[0-9]+$ ]]; then
            echo "invalid tcpdump PID: $tcpdump_pid" >&2
            exit 1
          fi
          echo "TCPDUMP_PID=$tcpdump_pid" >> "$GITHUB_ENV"
          sleep 1
          if ! sudo -n kill -0 "$tcpdump_pid" 2>/dev/null; then
            cat "$TCP_TEST_DIAGNOSTICS/tcpdump.log" >&2 || true
            echo "tcpdump exited before the TCP probe" >&2
            exit 1
          fi
      - name: Start attached echo app [${{ matrix.id }}]
        env:
          ECHO_BINARY: ${{ runner.temp }}/tcp-lab-binaries/bin/tun_tcp_echo
          HAMMER_RUST_LIBDIR: ${{ runner.temp }}/tcp-lab-binaries/rustlib
        run: |
          set -euo pipefail
          if [[ ! -x "$ECHO_BINARY" ]]; then
            echo "missing echo binary: $ECHO_BINARY" >&2
            exit 1
          fi
          : > "$TCP_TEST_DIAGNOSTICS/echo.log"
          echo_pid="$(
            sudo -n /bin/sh -c '
              log=$1
              binary=$2
              socket=$3
              rust_libdir=$4
              nohup env \
                LD_LIBRARY_PATH="$rust_libdir" \
                DYLD_LIBRARY_PATH="$rust_libdir" \
                "$binary" "$socket" \
                </dev/null >>"$log" 2>&1 &
              echo $!
            ' hammer-echo \
              "$TCP_TEST_DIAGNOSTICS/echo.log" \
              "$ECHO_BINARY" \
              "$TCP_TEST_ATTACH_SOCKET" \
              "$HAMMER_RUST_LIBDIR"
          )"
          if [[ ! "$echo_pid" =~ ^[0-9]+$ ]]; then
            echo "invalid echo PID: $echo_pid" >&2
            exit 1
          fi
          echo "ECHO_PID=$echo_pid" >> "$GITHUB_ENV"
      - name: Capture state before probe [${{ matrix.id }}]
        run: |
          set +e
          "$RUNNER_TEMP/tcp-lab-binaries/bin/hammerctl" \
            --addr "$TCP_TEST_IPC_ADDRESS" status \
            > "$TCP_TEST_DIAGNOSTICS/status-before.txt" 2>&1
          sudo -n ps -ww -o pid,ppid,state,%cpu,%mem,etime,command -p "$HAMMER_PID" \
            > "$TCP_TEST_DIAGNOSTICS/process-before-probe.txt" 2>&1
          sudo -n lsof -nP -p "$HAMMER_PID" \
            > "$TCP_TEST_DIAGNOSTICS/files-before-probe.txt" 2>&1
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ip address show dev "$TCP_TEST_INTERFACE" \
              > "$TCP_TEST_DIAGNOSTICS/interface-before-probe.txt" 2>&1
            ip route show table all \
              > "$TCP_TEST_DIAGNOSTICS/routes-before-probe.txt" 2>&1
          else
            ifconfig "$TCP_TEST_INTERFACE" \
              > "$TCP_TEST_DIAGNOSTICS/interface-before-probe.txt" 2>&1
            netstat -rn > "$TCP_TEST_DIAGNOSTICS/routes-before-probe.txt" 2>&1
          fi
      - name: Run echo probe [${{ matrix.id }}]
        if: matrix.fault == 'none'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 scripts/tcp-connect-probe.py \
            --host "$TCP_TEST_ADDRESS" \
            --port "$TCP_TEST_PORT" \
            --attempts 30 \
            --connect-timeout 2 \
            --retry-delay 1 \
            --mss "$TCP_TEST_MSS" \
            --echo-bytes "${{ matrix.echo_bytes }}" \
            --idle-seconds "${{ matrix.idle_seconds }}" \
            2>&1 | tee "$TCP_TEST_DIAGNOSTICS/probe.log"
      - name: Run fault-injected echo probe [${{ matrix.id }}]
        if: matrix.fault != 'none'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ready_file="$RUNNER_TEMP/probe-ready"
          continue_file="$RUNNER_TEMP/probe-continue"
          rm -f "$ready_file" "$continue_file"
          python3 scripts/tcp-connect-probe.py \
            --host "$TCP_TEST_ADDRESS" \
            --port "$TCP_TEST_PORT" \
            --attempts 30 \
            --connect-timeout 2 \
            --retry-delay 1 \
            --mss "$TCP_TEST_MSS" \
            --echo-bytes "${{ matrix.echo_bytes }}" \
            --idle-seconds "${{ matrix.idle_seconds }}" \
            --echo-timeout 120 \
            --ready-file "$ready_file" \
            --continue-file "$continue_file" \
            --continue-timeout 60 \
            > "$TCP_TEST_DIAGNOSTICS/probe.log" 2>&1 &
          probe_pid=$!
          for _ in {1..100}; do
            [[ -f "$ready_file" ]] && break
            sleep 0.1
          done
          if [[ ! -f "$ready_file" ]]; then
            cat "$TCP_TEST_DIAGNOSTICS/probe.log" >&2
            echo "probe never completed the TCP handshake" >&2
            exit 1
          fi
          client_first=""
          server_first=""
          for _ in {1..50}; do
            summary="$(python3 scripts/tcp-pcap-assert.py \
              --input "$TCP_TEST_DIAGNOSTICS/traffic.pcap" \
              --server "$TCP_TEST_ADDRESS" \
              --port "$TCP_TEST_PORT" || true)"
            client_first="$(sed -n 's/^client_first_data_seq=//p' <<<"$summary")"
            server_first="$(sed -n 's/^server_first_data_seq=//p' <<<"$summary")"
            [[ -n "$client_first" && -n "$server_first" ]] && break
            sleep 0.2
          done
          if [[ -z "$client_first" || -z "$server_first" ]]; then
            echo "failed to parse handshake ISNs from the live capture" >&2
            exit 1
          fi
          case "${{ matrix.fault }}" in
            client-egress) fault_base="$client_first" ;;
            server-ingress) fault_base="$server_first" ;;
          esac
          target_seq="$(python3 -c \
            "print((int('$fault_base') + ${{ matrix.fault_offset }}) % (2 ** 32))")"
          echo "fault target sequence: $target_seq (${{ matrix.fault }})"
          echo "TCP_TEST_TARGET_SEQ=$target_seq" >> "$GITHUB_ENV"
          # One-shot absolute-sequence drop: an nftables `tcp sequence` rule
          # with a 1-packet limit disarms itself after the first hit, so the
          # later retransmission of the same sequence passes without racing a
          # rule deletion against RACK's reordering window.
          command -v nft >/dev/null || sudo -n apt-get install -y nftables
          sudo -n nft add table ip tcplab
          case "${{ matrix.fault }}" in
            client-egress)
              sudo -n nft add chain ip tcplab fault \
                '{ type filter hook output priority 0 ; }'
              sudo -n nft add rule ip tcplab fault \
                ip daddr "$TCP_TEST_ADDRESS" tcp dport "$TCP_TEST_PORT" \
                tcp sequence "$target_seq" \
                limit rate 1/hour burst 1 packets counter drop
              ;;
            server-ingress)
              sudo -n nft add chain ip tcplab fault \
                '{ type filter hook input priority 0 ; }'
              sudo -n nft add rule ip tcplab fault \
                ip saddr "$TCP_TEST_ADDRESS" tcp sport "$TCP_TEST_PORT" \
                tcp sequence "$target_seq" \
                limit rate 1/hour burst 1 packets counter drop
              ;;
          esac
          "$RUNNER_TEMP/tcp-lab-binaries/bin/hammerctl" \
            --addr "$TCP_TEST_IPC_ADDRESS" status \
            > "$TCP_TEST_DIAGNOSTICS/status-before-fault.txt" 2>&1 || true
          touch "$continue_file"
          probe_status=0
          wait "$probe_pid" || probe_status=$?
          sudo -n nft list table ip tcplab \
            > "$TCP_TEST_DIAGNOSTICS/fault-rule.txt" 2>&1 || true
          cat "$TCP_TEST_DIAGNOSTICS/probe.log"
          cat "$TCP_TEST_DIAGNOSTICS/fault-rule.txt"
          hits="$(grep -oE 'counter packets [0-9]+' \
            "$TCP_TEST_DIAGNOSTICS/fault-rule.txt" \
            | grep -oE '[0-9]+' | head -1)"
          if [[ "${hits:-0}" -lt 1 ]]; then
            echo "fault rule never matched target sequence $target_seq" >&2
            exit 1
          fi
          echo "fault rule hits: $hits"
          exit "$probe_status"
      - name: Capture state after probe [${{ matrix.id }}]
        if: always()
        run: |
          set +e
          "$RUNNER_TEMP/tcp-lab-binaries/bin/hammerctl" \
            --addr "$TCP_TEST_IPC_ADDRESS" status \
            > "$TCP_TEST_DIAGNOSTICS/status-after.txt" 2>&1
          sudo -n ps -ww -o pid,ppid,state,%cpu,%mem,etime,command -p "${HAMMER_PID:-0}" \
            > "$TCP_TEST_DIAGNOSTICS/process-after-probe.txt" 2>&1
          sudo -n lsof -nP -p "${HAMMER_PID:-0}" \
            > "$TCP_TEST_DIAGNOSTICS/files-after-probe.txt" 2>&1
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ip address show dev "${TCP_TEST_INTERFACE:-utun}" \
              > "$TCP_TEST_DIAGNOSTICS/interface-after-probe.txt" 2>&1
            ip -s link show dev "${TCP_TEST_INTERFACE:-utun}" \
              > "$TCP_TEST_DIAGNOSTICS/interface-counters-after-probe.txt" 2>&1
            ip route show table all \
              > "$TCP_TEST_DIAGNOSTICS/routes-after-probe.txt" 2>&1
          elif [[ -n "${TCP_TEST_INTERFACE:-}" ]]; then
            ifconfig "$TCP_TEST_INTERFACE" \
              > "$TCP_TEST_DIAGNOSTICS/interface-after-probe.txt" 2>&1
            netstat -ibn -I "$TCP_TEST_INTERFACE" \
              > "$TCP_TEST_DIAGNOSTICS/interface-counters-after-probe.txt" 2>&1
            netstat -rn > "$TCP_TEST_DIAGNOSTICS/routes-after-probe.txt" 2>&1
          fi
      - name: Stop capture and decode [${{ matrix.id }}]
        if: always()
        run: |
          set +e
          if [[ "${TCPDUMP_PID:-}" =~ ^[0-9]+$ ]] \
            && sudo -n kill -0 "$TCPDUMP_PID" 2>/dev/null
          then
            sudo -n kill -INT "$TCPDUMP_PID" 2>/dev/null || true
            for _ in {1..40}; do
              sudo -n kill -0 "$TCPDUMP_PID" 2>/dev/null || break
              sleep 0.25
            done
            sudo -n kill -KILL "$TCPDUMP_PID" 2>/dev/null || true
          fi
          if [[ -f "$TCP_TEST_DIAGNOSTICS/traffic.pcap" ]]; then
            sudo -n tcpdump -nn -S -r "$TCP_TEST_DIAGNOSTICS/traffic.pcap" \
              > "$TCP_TEST_DIAGNOSTICS/decode.txt" 2>&1 || true
            sudo -n tcpdump -nn -S -tttt -r "$TCP_TEST_DIAGNOSTICS/traffic.pcap" \
              > "$TCP_TEST_DIAGNOSTICS/traffic.txt" 2>&1 || true
          fi
      - name: Assert packet behavior [${{ matrix.id }}]
        run: |
          set -euo pipefail
          case "${{ matrix.scenario }}" in
            attached-echo-keepalive)
              extra_args=(--min-keepalive-probes 1)
              ;;
            congestion-bbr|congestion-cubic)
              extra_args=(
                --min-server-data-bytes "${{ matrix.echo_bytes }}"
                --min-server-data-packets 500
              )
              ;;
            receiver-sack)
              extra_args=(--min-sack-acks 1)
              ;;
            sender-rack)
              extra_args=(
                --require-server-retransmit "$TCP_TEST_TARGET_SEQ"
                --retransmit-within 1.5
              )
              ;;
            sender-tlp)
              extra_args=(--require-server-retransmit "$TCP_TEST_TARGET_SEQ")
              ;;
          esac
          python3 scripts/tcp-pcap-assert.py \
            --input "$TCP_TEST_DIAGNOSTICS/traffic.pcap" \
            --server "$TCP_TEST_ADDRESS" \
            --port "$TCP_TEST_PORT" \
            --assert-handshake \
            "${extra_args[@]}" \
            2>&1 | tee "$TCP_TEST_DIAGNOSTICS/pcap-assert.log"
      - name: Assert recovery counters [${{ matrix.id }}]
        if: matrix.scenario == 'sender-rack' || matrix.scenario == 'sender-tlp'
        run: |
          set -euo pipefail
          counter_total() {
            grep -E 'node (session|tcp)[^:]*:' "$1" 2>/dev/null \
              | grep -oE 'errors=\[[^]]*\]' \
              | grep -oE "[[,]$2=[0-9]+" \
              | grep -oE '[0-9]+$' \
              | awk '{ sum += $1 } END { print sum + 0 }'
          }
          before="$TCP_TEST_DIAGNOSTICS/status-before-fault.txt"
          after="$TCP_TEST_DIAGNOSTICS/status-after.txt"
          # TcpNodeError codes: 14=RackRetransmit 15=TlpProbe 16=RTO retransmit
          rack_delta=$(( $(counter_total "$after" 14) - $(counter_total "$before" 14) ))
          tlp_delta=$(( $(counter_total "$after" 15) - $(counter_total "$before" 15) ))
          rto_delta=$(( $(counter_total "$after" 16) - $(counter_total "$before" 16) ))
          echo "rack_delta=$rack_delta tlp_delta=$tlp_delta rto_delta=$rto_delta"
          case "${{ matrix.scenario }}" in
            sender-rack)
              if [[ "$rack_delta" -lt 1 ]]; then
                echo "RackRetransmit counter did not increase" >&2
                exit 1
              fi
              ;;
            sender-tlp)
              if [[ "$tlp_delta" -lt 1 ]]; then
                echo "TlpProbe counter did not increase" >&2
                exit 1
              fi
              if [[ "$rto_delta" -ne 0 ]]; then
                echo "RTO retransmit fired before the tail-loss probe" >&2
                exit 1
              fi
              ;;
          esac
      - name: Remove fault rules
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          if command -v nft >/dev/null; then
            sudo -n nft delete table ip tcplab 2>/dev/null || true
          fi
      - name: Remove Linux host route
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          if [[ -n "${TCP_TEST_INTERFACE:-}" ]]; then
            sudo -n ip route delete "$TCP_TEST_ROUTE_PREFIX" \
              dev "$TCP_TEST_INTERFACE" >/dev/null 2>&1 || true
          fi
      - name: Remove macOS host route
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          if [[ -n "${TCP_TEST_INTERFACE:-}" ]]; then
            sudo -n route -n delete -net "$TCP_TEST_ROUTE_PREFIX" \
              -interface "$TCP_TEST_INTERFACE" >/dev/null 2>&1 || true
          fi
      - name: Stop integration processes [${{ matrix.id }}]
        if: always()
        run: |
          set +e
          for pid_var in ECHO_PID HAMMER_PID; do
            pid=""
            case "$pid_var" in
              ECHO_PID) pid="${ECHO_PID:-}" ;;
              HAMMER_PID) pid="${HAMMER_PID:-}" ;;
            esac
            if [[ "$pid" =~ ^[0-9]+$ ]] \
              && sudo -n kill -0 "$pid" 2>/dev/null
            then
              sudo -n kill -TERM "$pid" 2>/dev/null || true
              for _ in {1..20}; do
                sudo -n kill -0 "$pid" 2>/dev/null || break
                sleep 0.25
              done
              sudo -n kill -KILL "$pid" 2>/dev/null || true
            fi
          done
          sudo -n rm -f "$TCP_TEST_ATTACH_SOCKET"
          sudo -n chmod -R a+rX "$TCP_TEST_DIAGNOSTICS" || true
      - name: Upload diagnostics [${{ matrix.id }}]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-integration-${{ matrix.id }}-diagnostics
          path: ${{ env.TCP_TEST_DIAGNOSTICS }}
          if-no-files-found: error
