name: Page Allocation
run-name: Verify page allocation for ${{ github.ref_name }} (${{ github.event_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-allocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Page policy [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: page-policy-${{ matrix.platform }}
      - name: Verify strict Linux HugeTLB behavior
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" "HOME=$HOME" make verify-hugepages
      - name: Verify unsupported HugeTLB rejection [macOS]
        if: runner.os == 'macOS'
        run: >-
          cargo test --locked -p hammer-infra
          explicit_hugepage_is_rejected_on_unsupported_platform
          -- --nocapture
