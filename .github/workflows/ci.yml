name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-linux:
    name: fmt [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout [linux]
        uses: actions/checkout@v4
      - name: Install Rust [linux]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting [linux]
        run: cargo fmt --all -- --check

  clippy:
    name: clippy [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.platform }}
      - name: Run clippy [${{ matrix.platform }}]
        run: cargo clippy --workspace --all-targets

  test:
    name: test [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.platform }}
      - name: Verify allocation contract [${{ matrix.platform }}]
        run: make verify-allocation-contract
      - name: Run workspace tests [${{ matrix.platform }}]
        run: cargo test --workspace

  dataplane-performance:
    name: dataplane performance [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: dataplane-performance-${{ matrix.platform }}
      - name: Measure dataplane performance [${{ matrix.platform }}]
        run: make verify-dataplane-performance

  bihash-read-scaling-linux:
    name: bihash read scaling [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout [linux]
        uses: actions/checkout@v4
      - name: Install Rust [linux]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [linux]
        uses: Swatinem/rust-cache@v2
        with:
          key: bihash-read-scaling-linux
      - name: Check bihash read scaling [linux]
        env:
          RUSTFLAGS: ""
        run: >-
          cargo test -p hammer-infra --release --test bihash_read_scaling
          -- --ignored --nocapture

  hugetlb-linux:
    name: HugeTLB [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout [linux]
        uses: actions/checkout@v4
      - name: Install Rust [linux]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [linux]
        uses: Swatinem/rust-cache@v2
        with:
          key: hugetlb-linux
      - name: Verify strict Linux HugeTLB behavior
        run: sudo env "PATH=$PATH" "HOME=$HOME" make verify-hugepages
