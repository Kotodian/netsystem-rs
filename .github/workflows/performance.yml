name: Performance
run-name: Measure performance for ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataplane:
    name: Dataplane performance [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: dataplane-performance-${{ matrix.platform }}
      - name: Measure dataplane performance [${{ matrix.platform }}]
        run: make verify-dataplane-performance

  bihash-read-scaling:
    name: Bihash read scaling [Linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout [Linux]
        uses: actions/checkout@v4
      - name: Install Rust [Linux]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [Linux]
        uses: Swatinem/rust-cache@v2
        with:
          key: bihash-read-scaling-linux
      - name: Check Bihash read scaling [Linux]
        env:
          RUSTFLAGS: ""
        run: >-
          cargo test -p hammer-infra --release --test bihash_read_scaling
          -- --ignored --nocapture
