name: Allocation Contract
run-name: Verify allocation contract for ${{ github.ref_name }} (${{ github.event_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allocation-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Allocation contract [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: allocation-contract-${{ matrix.platform }}
      - name: Verify allocation contract [${{ matrix.platform }}]
        run: make verify-allocation-contract
