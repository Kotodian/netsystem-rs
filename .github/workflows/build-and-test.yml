name: Build and Test
run-name: Build and test ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting [Linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout [Linux]
        uses: actions/checkout@v4
      - name: Install Rust [Linux]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting [Linux]
        run: cargo fmt --all -- --check

  workspace-build:
    name: Workspace build [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace-build-${{ matrix.platform }}
      - name: Build workspace [${{ matrix.platform }}]
        run: cargo build --locked --workspace --all-targets

  clippy:
    name: Clippy [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.platform }}
      - name: Run Clippy [${{ matrix.platform }}]
        run: cargo clippy --locked --workspace --all-targets

  workspace-tests:
    name: Workspace tests [${{ matrix.platform }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout [${{ matrix.platform }}]
        uses: actions/checkout@v4
      - name: Install Rust [${{ matrix.platform }}]
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo [${{ matrix.platform }}]
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace-tests-${{ matrix.platform }}
      - name: Run workspace tests [${{ matrix.platform }}]
        run: cargo test --locked --workspace
