[workspace]
resolver = "3"
members = [
    "crates/hammer-core",
    "crates/hammer-adapter",
    "crates/hammer-runtime",
    "crates/hammer-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
url = "2.5"
once_cell = "1.21"
thiserror = "2.0"
async-trait = "0.1"
uniffi = "0.31"
indoc = "2.0"
