[workspace]
resolver = "3"
members = [
    "crates/hammer-core",
    "crates/hammer-adapter",
    "crates/hammer-runtime",
    "crates/hammer-ffi",
    "crates/hammer-uniffi-bindgen",
]
exclude = [
    "third_party/quinn/quinn",
    "third_party/quinn/quinn-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Size-optimised release profile for the hammer-ffi static library that ships
# inside the iOS xcframework. fat LTO + single CGU enables cross-crate dead
# code elimination; opt-level "z" + strip drops another large slice without
# noticeable runtime cost for a network proxy workload.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
url = "2.5"
once_cell = "1.21"
thiserror = "2.0"
async-trait = "0.1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
# default features off — reqwest's `default-tls` pulls aws-lc-rs which conflicts
# with the workspace-wide ring backend. We use rustls-no-provider and install
# the ring CryptoProvider once during Service::new.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
bytes = "1.11"
http = "1.4"
hyper = { version = "1.9", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures = "0.3"
quinn = { version = "0.11.8", default-features = false, features = ["runtime-tokio", "rustls"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
blake2 = "0.10"
base64 = "0.22"
rand = "0.8"
smoltcp = "0.13"
tun-rs = { version = "2.8.3", features = ["async"] }
etherparse = "0.20.1"
ipnet = "2"
libc = "0.2"
uniffi = "0.31"
indoc = "2.0"
rcgen = "0.14"

[patch.crates-io]
quinn = { path = "third_party/quinn/quinn" }
quinn-proto = { path = "third_party/quinn/quinn-proto" }
