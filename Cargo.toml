[workspace]
resolver = "3"
members = [
    "crates/hammer-core",
    "crates/hammer-adapter",
    "crates/hammer-runtime",
    "crates/hammer-ffi",
]
exclude = [
    "third_party/quinn/quinn",
    "third_party/quinn/quinn-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
url = "2.5"
once_cell = "1.21"
thiserror = "2.0"
async-trait = "0.1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
reqwest = { version = "0.13" }
bytes = "1.11"
http = "1.4"
futures = "0.3"
quinn = { version = "0.11.8", default-features = false, features = ["runtime-tokio", "rustls"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
blake2 = "0.10"
rand = "0.8"
smoltcp = "0.13"
tun-rs = { version = "2.8.3", features = ["async"] }
etherparse = "0.20.1"
ipnet = "2"
uniffi = "0.31"
indoc = "2.0"
rcgen = "0.14"

[patch.crates-io]
quinn = { path = "third_party/quinn/quinn" }
quinn-proto = { path = "third_party/quinn/quinn-proto" }
