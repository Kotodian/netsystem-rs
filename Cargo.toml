[workspace]
resolver = "3"
members = [
    "crates/hammer-core",
    "crates/hammer-adapter",
    "crates/hammer-runtime",
    "crates/hammer-ffi",
    "crates/hammer-uniffi-bindgen",
]
exclude = [
    "third_party/quinn/quinn",
    "third_party/quinn/quinn-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Size-optimised release profile for the hammer-ffi static library that ships
# inside the iOS xcframework. fat LTO + single CGU enables cross-crate dead
# code elimination; opt-level "z" + strip drops another large slice without
# noticeable runtime cost for a network proxy workload.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

# Profiling-friendly variant: same codegen as release but keeps line-table
# debuginfo so iOS Instruments can symbolicate Rust frames. Build via
# `PROFILE=release-perf ./scripts/build-xcframework.sh`. Not the default — the
# binary is ~30-50% larger because of the line tables.
[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_path_to_error = "0.1"
toml = "1.1"
url = { version = "2.5", features = ["serde"] }
httparse = "1.10"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
metrics = "0.24"
metrics-derive = "0.1"
humantime-serde = "1.1"
serde_with = { version = "3.18", default-features = false, features = ["std"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
bytes = "1.11"
http = "1.4"
hyper = { version = "1.9", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures = "0.3"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
rustls-platform-verifier = { version = "0.7", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
blake2 = "0.10"
base64 = "0.22"
rand = "0.8"
smoltcp = { version = "0.13", features = [
    # IPv4 reassembly is in smoltcp's default features but the fallback
    # REASSEMBLY_BUFFER_SIZE / COUNT consts (1500 / 1) make it a no-op —
    # bumping to 8 KiB × 4 lets us actually reassemble fragmented packets
    # (DNS-over-UDP large responses, QUIC initial jumbo, etc.). IPv6
    # reassembly isn't in default at all; iOS NetExt traffic needs it.
    # Outbound fragmentation buffer kept in sync for symmetry — current
    # ChannelDevice MTU caps smoltcp's tx side so this rarely fires, but
    # leaves the door open for future paths that send large datagrams.
    "proto-ipv6-fragmentation",
    "reassembly-buffer-size-8192",
    "reassembly-buffer-count-4",
    "fragmentation-buffer-size-8192",
] }
socket2 = "0.6"
boringtun = { version = "0.7", default-features = false }
lru = { version = "0.18", default-features = false }
tun-rs = { version = "2.8.3", features = ["async"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
# Fast non-cryptographic hasher for internal HashMaps. Used by the ipstack
# actor to keep `tcp_bridges` / `udp_bridges` lookups out of the SipHasher
# path (~1.6% CPU on the wg hot path under sustained video).
rustc-hash = "2"
uniffi = "0.31"
indoc = "2.0"
rcgen = "0.14"

[patch.crates-io]
quinn = { path = "third_party/quinn/quinn" }
quinn-proto = { path = "third_party/quinn/quinn-proto" }
